[project]
name = "vault-mcp"
version = "0.1.0"
description = "Secretos para agentes de IA, con permiso explícito por agente."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.2.0",
    "cryptography>=44.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.34"]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
vault-mcp = "vault_mcp.mcp.server:main"
vault-admin = "vault_mcp.mcp.admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vault_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
