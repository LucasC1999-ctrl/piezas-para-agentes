[project]
name = "planilla-watch"
version = "0.1.0"
description = "Vigila una planilla de credenciales y avisa por Buzz cuando algo cambia."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
planilla-watch = "planilla_watch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planilla_watch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
